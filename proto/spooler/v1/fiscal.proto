syntax = "proto3";

package spooler.v1;

option go_package = "spoolerfiscal/proto/spooler/v1;spoolerv1";

// FiscalSpooler es el contrato entre el agente de cada estación y el spooler
// central. El campo `command` de SendCommand es opaco: viajan los bytes del
// protocolo fiscal tal cual los generó Profit Plus, sin interpretación en el
// agente. La única interpretación ocurre en el servidor, junto a la impresora.
//
// Autenticación: todas las RPC exigen el token compartido, enviado en la
// metadata gRPC `authorization: Bearer <token>` (o `x-spooler-token: <token>`).
service FiscalSpooler {
  // Ping valida conectividad, token y versión del protocolo.
  rpc Ping(PingRequest) returns (PingResponse);

  // OpenSession registra la estación y reserva su sesión de trabajo.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);

  // CloseSession libera la sesión de la estación.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);

  // SendCommand transporta un comando fiscal y devuelve la respuesta íntegra
  // de la impresora (bytes sin modificar).
  rpc SendCommand(CommandRequest) returns (CommandResponse);

  // GetStatus devuelve el estado de la impresora, la cola y los contadores.
  rpc GetStatus(StatusRequest) returns (StatusResponse);

  // GetPrinterInfo devuelve modelo, serial, firmware y memoria fiscal.
  rpc GetPrinterInfo(PrinterInfoRequest) returns (PrinterInfoResponse);
}

message PingRequest {
  string client_version = 1;
}

message PingResponse {
  string server_version = 1;
  // Versión del contrato gRPC; el agente rechaza versiones incompatibles.
  uint32 protocol_version = 2;
  int64 server_time_unix = 3;
  string printer_driver = 4;
}

message OpenSessionRequest {
  // Identificador único y estable de la estación (ej. "CAJA-01").
  string station_id = 1;
  string client_version = 2;
}

message OpenSessionResponse {
  string session_id = 1;
  PrinterInfo printer = 2;
  PrinterStatus status = 3;
  // Secuencia del último documento registrado antes de abrir la sesión.
  int64 last_sequence = 4;
}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {
  bool closed = 1;
  uint64 commands_processed = 2;
}

message CommandRequest {
  string session_id = 1;
  // Bytes crudos del protocolo fiscal.
  bytes command = 2;
  // Tiempo máximo de espera en la cola + impresora. 0 = valor por defecto.
  uint32 timeout_ms = 3;
  // Referencia del agente para trazabilidad (no se interpreta).
  string client_ref = 4;
}

message CommandResponse {
  // Respuesta cruda de la impresora, byte a byte.
  bytes response = 1;
  PrinterStatus status = 2;
  // Presente sólo cuando el comando emitió un documento fiscal.
  DocumentRecord document = 3;
  // Número de secuencia global del spooler (orden de ejecución).
  int64 sequence = 4;
  // Milisegundos que el comando estuvo en cola antes de ejecutarse.
  uint64 queue_wait_ms = 5;
  // Milisegundos totales desde la recepción hasta la respuesta.
  uint64 latency_ms = 6;
}

message PrinterStatus {
  bool online = 1;
  uint32 status_byte = 2;
  uint32 error_byte = 3;
  string status_text = 4;
  string error_text = 5;
  bool paper_out = 6;
  bool fiscal_memory_full = 7;
  bool fiscal_memory_almost_full = 8;
  bool document_open = 9;
  // El spooler bloquea emisiones en este estado.
  bool blocked = 10;
  string blocked_reason = 11;
  string last_error = 12;
  	int64 checked_at_unix = 13;
	uint32 queue_depth = 14;
	string raw = 15;
	// Estación que tiene una factura abierta (turno exclusivo del spooler).
	string document_owner = 16;
}

message PrinterInfo {
  string brand = 1;
  string model = 2;
  string serial = 3;
  string firmware = 4;
  string fiscal_rif = 5;
  double fiscal_memory_total_mb = 6;
  double fiscal_memory_free_mb = 7;
  int64 last_invoice_number = 8;
  int64 last_credit_note_number = 9;
  int64 last_debit_note_number = 10;
  string port = 11;
}

message DocumentRecord {
  int64 sequence = 1;
  string doc_type = 2;
  int64 doc_number = 3;
  string station_id = 4;
  string session_id = 5;
  int64 issued_at_unix = 6;
  string request_sha256 = 7;
  string response_sha256 = 8;
  string response_text = 9;
  // El número ya existía en el historial: doble emisión detectada.
  bool duplicate = 10;
  string client_ref = 11;
}

message StatusRequest {
  string session_id = 1;
  // Fuerza una consulta a la impresora en lugar de usar el estado cacheado.
  bool probe = 2;
}

message StatusResponse {
  PrinterStatus status = 1;
  uint32 queue_depth = 2;
  uint64 documents_issued = 3;
  uint64 commands_total = 4;
  uint64 commands_failed = 5;
  double avg_latency_ms = 6;
  double max_latency_ms = 7;
  uint64 duplicates_detected = 8;
  int64 uptime_seconds = 9;
  int64 last_sequence = 10;
  string last_document_summary = 11;
}

message PrinterInfoRequest {
  string session_id = 1;
}

message PrinterInfoResponse {
  PrinterInfo info = 1;
}
