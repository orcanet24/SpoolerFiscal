# Configuración del Spooler Fiscal Central
# Copie este archivo junto al binario y ajuste los valores antes de instalar el
# servicio. El token puede fijarse aquí o en la variable de entorno SPOOLER_TOKEN.

# Interfaz de escucha gRPC para las estaciones.
listen: 0.0.0.0:5050

# Token compartido con los agentes. Cámbielo en producción.
token: CAMBIAR-ESTE-TOKEN

# mTLS opcional (mejora futura ya soportada). Requiere certificados.
tls:
  enabled: false
  ca_file: ""          # CA que firma los certificados de las estaciones (activa mTLS)
  cert_file: ""        # certificado del servidor
  key_file: ""         # clave privada del servidor

# Lista blanca de estaciones. Vacía = se acepta cualquier station_id.
allowed_stations: []

# Expiración de sesiones inactivas.
session_ttl_minutes: 120

printer:
  driver: tfhka              # único driver implementado (The Factory HKA, ASCII)
  transport: serial          # serial | tcp (tcp = laboratorio / ser2net)
  port:
    name: COM1
    baud_rate: 9600
    data_bits: 8
    parity: none             # none | odd | even | mark | space
    stop_bits: "1"           # 1 | 1.5 | 2
    flow_control: none       # none | xonxoff (rtscts: configúrelo en el driver)
  tcp_address: 127.0.0.1:2011
  tcp_dial_timeout_ms: 3000
  read_gap_ms: 30            # silencio que cierra una respuesta
  response_timeout_ms: 20000
  max_response_bytes: 32768
  write_settle_ms: 0
  status_probe: S2           # comando de sonda de estado
  command_terminator: "\r\n"   # CR+LF: con CR solo la TFHKA no responde
  open_retry_ms: 500

queue:
  max_pending: 256           # comandos en espera antes de rechazar
  default_timeout_ms: 30000
  max_timeout_ms: 120000
  probe_timeout_ms: 5000
  # Turno exclusivo por factura: la estación que abre una factura no lo suelta
  # hasta cerrarla. Si Profit Plus muere a mitad, se libera tras este tiempo.
  # 0 = no liberar nunca (requiere reiniciar el servicio).
  document_lock_timeout_ms: 120000

# El spooler rechaza emisiones si la impresora no está en estado esperado.
guard:
  block_on_paper_out: true
  block_on_memory_full: true
  block_on_error: true       # sólo errores físicos/fiscales (0x01-0x03, 0x60, 0x64, 0x6C, 0x80, 0x89, 0x90)
  block_when_offline: false  # true = rechaza de inmediato si el puerto no abre

database:
  path: data/spooler.db      # SQLite embebido (driver puro Go)
  log_commands: true         # bitácora de comandos (hashes, latencia, resultado)
  retention_days: 365        # purga de bitácora (los documentos NO se purgan)

logging:
  level: info                # debug | info | warn | error
  file: logs/server.log
  console: true
  max_size_mb: 20
  max_backups: 10
  max_age_days: 30
  compress: true

metrics:
  interval_seconds: 60

# API REST opcional para ecommerce, ERP web o CRM. Comparte token, cola,
# turno por factura y correlativo con las estaciones. Ver docs/API.md y
# api/openapi.yaml. Use TLS si cruza la red de la empresa.
http:
  enabled: true
  listen: 0.0.0.0:8080
  max_body_bytes: 262144
  read_timeout_ms: 15000
  write_timeout_ms: 60000
  idempotency_retention_days: 30
